# Every pydelity setting at its default value. Copy this file, change what you need
# and pass it with `pydelity --config config.yaml`. Options given on the command line
# win over this file. Relative paths are relative to this file's folder.

# Settings most runs never need to change.
advanced:
  # Settings for page extraction. They apply to page extraction's requests and to its
  # verifier's requests alike.
  extraction:
    # How many times a model may answer again after failing page extraction's
    # checks, from 0 to 5.
    check_retries: 2
    # How many pages are extracted at the same time, from 1 to 32.
    concurrent_pages: 8
    # How hard the model thinks before answering: low, medium or high.
    effort: high
    # What is particular, different or nuanced about this PDF, in your own words,
    # for page extraction's model and its verifier; none if null.
    instructions: null
    # The most tokens one model answer may contain, thinking included.
    max_output_tokens: 32000
    # The model for page extraction, as <provider>:<model-id>; model, or else page
    # extraction's default (anthropic:claude-opus-5-5), if null.
    model: null
    # How many seconds to wait for one model request before it counts as failed.
    request_timeout_seconds: 600
    # Whether a verifier reviews each page's extraction, at extra cost; verify if
    # null.
    verify: null
  # Prices for models, in US dollars per million tokens, by <provider>:<model-id>.
  # An entry replaces the price pydelity would look up for that model. This entry is
  # a placeholder for a model that does not exist: change it or remove it.
  models:
    "anthropic:your-model-id":
      # Price of input tokens read from the prompt cache; the input price if null.
      cache_read_usd_per_mtok: 0.1
      # Price of input tokens written to the prompt cache; the input price if null.
      cache_write_usd_per_mtok: 1.25
      # Price of input tokens.
      input_usd_per_mtok: 1.0
      # Price of output tokens.
      output_usd_per_mtok: 5.0
  # Settings for page-break verification. They apply to page-break verification's
  # requests and to its verifier's requests alike.
  page_breaks:
    # How many times a model may answer again after failing page-break
    # verification's checks, from 0 to 5.
    check_retries: 2
    # How many page breaks are judged at the same time, from 1 to 32.
    concurrent_breaks: 8
    # How hard the model thinks before answering: low, medium or high.
    effort: high
    # What is particular, different or nuanced about this PDF's page breaks, in your
    # own words, for page-break verification's model and its verifier only; none if
    # null.
    instructions: null
    # The most tokens one model answer may contain, thinking included.
    max_output_tokens: 32000
    # The model for page-break verification, as <provider>:<model-id>; model, or else
    # page-break verification's default (anthropic:claude-opus-5-5), if null.
    model: null
    # How many seconds to wait for one model request before it counts as failed.
    request_timeout_seconds: 600
    # Whether a verifier reviews each page break's verdict, at extra cost; verify if
    # null.
    verify: null
  # How many times a request to the provider is retried after a temporary failure,
  # from 0 to 10.
  provider_retries: 2
  # Settings for the survey step. They apply to the survey's requests and to its
  # verifier's requests alike.
  survey:
    # How many times the model may answer again after failing the survey's checks,
    # from 0 to 5.
    check_retries: 2
    # How hard the model thinks before answering: low, medium or high.
    effort: high
    # What is particular, different or nuanced about this PDF, in your own words,
    # for the survey's model and its verifier; none if null.
    instructions: null
    # The most tokens one model answer may contain, thinking included.
    max_output_tokens: 32000
    # How many seconds to wait for one model request before it counts as failed.
    request_timeout_seconds: 900
    # Whether a verifier reviews the survey's answer, at extra cost; verify if null.
    verify: null
  # Settings for PDFs uploaded to the provider.
  uploads:
    # How many hours the provider keeps an uploaded PDF; the provider's maximum if
    # null.
    expiry_hours: null

# The PDF's languages as BCP-47 tags, such as [en] or [en, ar].
languages: []

# The most the output folder's model requests may cost, in US dollars; no limit if
# null.
max_cost: null

# The model for every step, as <provider>:<model-id>; provider anthropic or openai.
# If null, each step uses its default, anthropic:claude-opus-5-5.
model: null

# The output folder; pydelity-output/<PDF name> in the current folder if null.
output_dir: null

# Whether to redo steps whose outputs could be reused.
overwrite: false

# The pages to extract, numbered from 1 as a PDF viewer shows them, such as "1-5,8";
# every page if null. The survey always reads every page.
pages: null

# Whether to stop after a step that wrote new output, so it can be checked before
# the next step is paid for.
pause: true

# The PDF to process. A PDF given on the command line wins over this one.
pdf: document.pdf

# Whether a verifier reviews each step's answer. The verifier is a second request to
# the step's model, which checks the answer against the PDF and may correct it. Each
# verifier request adds cost. Each step's verify setting under advanced overrides it.
verify: false
