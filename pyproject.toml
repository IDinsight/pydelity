# BUILD SYSTEM CONFIGS #
[build-system]
build-backend = "setuptools.build_meta"
# 77+ supports SPDX `license` expressions with `license-files`.
requires = ["setuptools>=77"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
include = ["pydelity*"]
where = ["src"]

# PROJECT METADATA #
[project]
authors = [{name = "IDinsight DSEM", email = "dsem@idinsight.org" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Programming Language :: Python :: 3.13",
]
dependencies = []
description = "Under development and not yet usable. PDF to structured JSON, faithfully."
keywords = ["structured", "JSON", "PDF", "genai", "llm", "agents"]
license = "MIT"
license-files = ["LICENSE"]
maintainers = [{name = "IDinsight DSEM", email = "dsem@idinsight.org" }]
name = "pydelity"
readme = "README.md"
requires-python = ">=3.13"
version = "0.0.1"

[project.urls]
Homepage = "https://github.com/IDinsight/pydelity"
Issues = "https://github.com/IDinsight/pydelity/issues"
Repository = "https://github.com/IDinsight/pydelity"

# DEV ENVIRONMENT #
# Dev tools live in a dependency group, so they never appear in published metadata.
[dependency-groups]
dev = [
    "black==25.9.0",
    "detect-secrets==1.5.0",
    "interrogate==1.7.0",
    "isort==6.1.0",
    "mypy==1.18.2",
    "mypy-extensions==1.1.0",
    "prek==0.5.11",
    "pylint==3.3.8",
    "pylint-pytest==1.1.8",
    "pytest==8.2.0",
    "pytest-asyncio==1.2.0",
    "pytest-bdd==8.1.0",
    "pytest-cov==7.0.0",
    "pytest-mock==3.15.1",
    "pytest-order==1.3.0",
    "pytest-randomly==4.0.1",
    "pytest-xdist==3.8.0",
    "ruff==0.13.3",
    "rust-just==1.59.0",
    "types-aiofiles==24.1.0.20250822",
    "types-requests==2.32.4.20260107",
    "zizmor==1.32.0",
]

[tool.uv]
# Reinstall the project when any packaged file changes, so new modules are picked up
# by the strict editable install below. Only the package folder is watched: the build
# writes `src/pydelity.egg-info/`, and watching that would rebuild on every `uv run`.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/pydelity/**/*" }]
# Strict editable install: the environment sees only the files a wheel would contain,
# instead of the whole `src/` directory, so packaging mistakes fail the tests.
config-settings-package = { pydelity = { editable_mode = "strict" } }
# A lower bound, not an exact pin: Dependabot's uv updater fails on any uv the bound
# excludes, so it must stay at or below the uv Dependabot runs.
required-version = ">=0.8.1"

# TOOLS #

# black
[tool.black]
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
setup.py
'''
include = '\.pyi?$'
line-length = 88

# interrogate
[tool.interrogate]
badge-format = "svg"
color = true
exclude = ["*/__init__.py"]
ext = []
generate-badge = "."  # Output file location (the repo root)
ignore-magic = false
ignore-init-method = false
ignore-init-module = false
ignore-private = false
ignore-property-decorators = false
ignore-module = false
ignore-nested-classes = false
ignore-nested-functions = false
ignore-overloaded-functions = false
ignore-semiprivate = false
ignore-setters = false
ignore-regex = ["__init__.py*", "^mock_.*"]
fail-under = 100
omit-covered-files = false
quiet = false
verbose = 0  # Possible values: 0 (minimal output), 1 (-v), 2 (-vv)
whitelist-regex = []

# isort
[tool.isort]
atomic = true
filter_files = true
import_heading_firstparty = "Package Library"
import_heading_future = "Future Library"
import_heading_localfolder = "Local Folder"
import_heading_stdlib = "Standard Library"
import_heading_thirdparty = "Third Party Library"
include_trailing_comma = true
known_first_party = "pydelity"
known_third_party = "git, mpi4py, ntpath, numpy, pexpect, pytest, sphinx_rtd_theme, yaml"
line_length = 88
lines_between_types = 1
multi_line_output = 3
profile = "black"

# mypy
[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

# pytest
# Tests import `pydelity` as installed in the environment; nothing adds `src` to the path.
[tool.pytest.ini_options]
asyncio_mode = "auto"
bdd_features_base_dir = "tests/features/"
markers = ["costs-money"]
testpaths = ["tests"]

# pytest coverage
[tool.coverage.report]
exclude_lines = [
    'if __name__ == "__main__"',
    "if __name__ == '__main__'",
    "def cli",
    "if TYPE_CHECKING:",
    "pragma: no cover",
]
omit = ["./src/pydelity/__init__.py"]

[tool.coverage.run]
branch = true
concurrency = ["thread"]
omit = ["*/tests/*", "*/__init__.py"]
source = ["pydelity"]

# ruff
[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint.mccabe]
max-complexity = 10
