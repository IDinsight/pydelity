name: Secret Scan (TruffleHog) on PRs to Main

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

# A newer push to the same pull request cancels the scan still running for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo (full history so base/head comparison works)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # important for comparing against base branch history
          # The scan reads the local clone only; don't leave the token in .git/config.
          persist-credentials: false

      - name: TruffleHog OSS
        id: trufflehog
        uses: trufflesecurity/trufflehog@ea68ca03c865c5f324e86e849ced20ed3cf9dbbb # v3.99.8
        with:
          # Scan only the commits in this PR: base..head
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          path: .
          # Recommended flags: keep logs small and fail only on live/validated secrets.
          extra_args: --only-verified

        # Intentionally allow the step to continue since we control failure below.
        continue-on-error: true

      - name: Fail if secrets found
        if: steps.trufflehog.outcome == 'failure'
        run: exit 1
