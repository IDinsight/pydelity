name: CI

# Runs the same commands that are executed locally: install, the hooks, every lint
# recipe and the tests on Python 3.13, the tests on Python 3.14, and the build with the
# wheel smoke test on Linux, macOS and Windows. The "Lint and test" job passes only when
# all of them pass. Pull requests to main include Dependabot's.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the run still going for it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The branch ruleset requires the check named "Lint and test". This job gives it that
  # name, and the work runs in the jobs it needs.
  gate:
    name: Lint and test
    needs: [lint-and-test, test-py314, wheel]
    # Without this the job is skipped when a needed job fails, and the ruleset counts a
    # skipped check as passed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Needed jobs ended with: $RESULTS"
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "::error::A needed job ended with '$result'."
              exit 1
            fi
          done

  lint-and-test:
    name: Lint and test (Python 3.13)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Kept by hand: one exact uv that meets `[tool.uv] required-version` in
          # pyproject.toml. Dependabot does not update it.
          version: "0.13.8"

      # prek's hook environments (Node, prettier, markdownlint, pre-commit-hooks) are
      # rebuilt only when the hook config or the locked prek version changes.
      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: prek-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml', 'uv.lock') }}

      # Python 3.13 comes from .python-version; uv installs it if the runner lacks it.
      - name: Install the dev environment
        run: uv run --locked just install

      # Hooks run before the lint recipes, which write fixes, so unformatted files fail
      # here instead of being fixed silently. The zizmor hook uses the token for its
      # online audits.
      - name: Run every git hook
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked prek run --all-files --show-diff-on-failure

      - name: Run every lint recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked just lint

      # The lint recipes regenerate the reference pages, so a changed file or a new page
      # left untracked means the commit is missing generated or fixed files.
      - name: Fail if the lint recipes changed or added any file
        run: |
          git diff --exit-code
          added="$(git status --porcelain --untracked-files=all -- docs/src/content/docs/reference)"
          if [[ -n "$added" ]]; then
            echo "::error::Generated reference pages are not committed:"
            echo "$added"
            exit 1
          fi

      - name: Run the tests
        run: uv run --locked just test

  test-py314:
    name: Test (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Overrides .python-version for every uv command in the job, the ones the test
      # recipe runs included, so the tests run on Python 3.14.
      UV_PYTHON: "3.14"
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Kept by hand, with the same version as the lint-and-test job.
          version: "0.13.8"

      - name: Run the tests
        run: uv run --locked just test

  wheel:
    name: Wheel install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      # Each system's result matters, so one failure does not cancel the others.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        # Git Bash on Windows, so the build recipe's bash commands run on every system.
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Kept by hand, with the same version as the lint-and-test job.
          version: "0.13.8"

      - name: Build the wheel and sdist and check their metadata
        run: uv run --locked just build

      # Installs the wheel with pip in a fresh environment and runs the pydelity command
      # and the Python API with each provider against a stand-in provider server.
      - name: Run the wheel smoke test
        run: uv run --locked python scripts/smoke_installed_wheel.py
