# Dependabot keeps the repo's pinned versions current: the dev tools in pyproject.toml
# and uv.lock (uv), the docs site's packages in docs/package.json and its lock file
# (npm), the remote hook revs in .pre-commit-config.yaml (pre-commit) and the action
# SHAs in the workflows (github-actions). Pins it cannot update carry a "Kept by hand"
# comment where they are set.
#
# Each ecosystem is checked monthly and its updates arrive as one pull request. A new
# release waits 7 days (the minimum zizmor accepts) before Dependabot proposes it.
version: 2
updates:
  - package-ecosystem: github-actions
    commit-message:
      prefix: ci(deps)
    cooldown:
      default-days: 7
    directory: /
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: monthly

  - package-ecosystem: npm
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    directory: /docs
    groups:
      npm:
        patterns: ["*"]
    schedule:
      interval: monthly

  - package-ecosystem: pre-commit
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    directory: /
    groups:
      pre-commit:
        patterns: ["*"]
    schedule:
      interval: monthly

  - package-ecosystem: uv
    commit-message:
      prefix: build(deps)
    cooldown:
      default-days: 7
    directory: /
    groups:
      uv:
        patterns: ["*"]
    schedule:
      interval: monthly
