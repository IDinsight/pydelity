# Git hooks, run by prek (`just install` installs them; `uv run prek run --all-files`
# runs them by hand). prek reads this pre-commit-format file; Dependabot and zizmor
# read it too, so it uses only remote repos, `local` hooks and `meta` hooks.
#
# Hooks that can rewrite files must not touch the STANDARDS workflow files, so each of
# them excludes the paths below. Read-only checks still scan them.
#   ^(\.standards/|\.agents/|\.claude/skills/|\.claude/settings\.json$|
#     \.codex/hooks\.json$|AGENTS\.md$|CLAUDE\.md$)
repos:
  # Generic file checks, in alphabetical order. The three that rewrite files
  # (end-of-file-fixer, mixed-line-ending, trailing-whitespace) skip STANDARDS paths.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Newly added files over 500 KB, such as a stray PDF.
      - id: check-added-large-files
      # File names that differ only in case, which break on macOS and Windows.
      - id: check-case-conflict
      # Leftover `<<<<<<<` / `>>>>>>>` merge markers.
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: ["--unsafe"]
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(\.standards/|\.agents/|\.claude/skills/|\.claude/settings\.json$|\.codex/hooks\.json$|AGENTS\.md$|CLAUDE\.md$)
      - id: mixed-line-ending
        exclude: ^(\.standards/|\.agents/|\.claude/skills/|\.claude/settings\.json$|\.codex/hooks\.json$|AGENTS\.md$|CLAUDE\.md$)
      - id: trailing-whitespace
        exclude: ^(\.standards/|\.agents/|\.claude/skills/|\.claude/settings\.json$|\.codex/hooks\.json$|AGENTS\.md$|CLAUDE\.md$)

  # Markdown: format every Markdown file with Prettier, then lint it. Both hooks
  # take their file list from git (`pass_filenames: false`), so files not yet added
  # are covered too.
  - repo: local
    hooks:
      # The only hook allowed to write STANDARDS files, and only whitespace changes
      # (see scripts/format_markdown.mjs). Where STANDARDS is installed, it runs the
      # STANDARDS check afterwards.
      - id: prettier-markdown
        name: prettier (Markdown)
        entry: node scripts/format_markdown.mjs
        language: node
        # Kept by hand: Dependabot does not update local hooks' Node or packages.
        language_version: "24.22.3"
        additional_dependencies: ["prettier@3.10.1"]
        types: [markdown]
        pass_filenames: false

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        # Kept by hand: Dependabot updates `rev` but not the Node version.
        language_version: "24.22.3"
        pass_filenames: false

  # Local hooks. They run the tools pinned in the `dev` dependency group of
  # pyproject.toml through `uv run --locked`, so hooks, just recipes and CI share
  # one set of versions.
  - repo: local
    hooks:
      # Secrets: compare against the committed baseline. To refresh it after
      # reviewing a finding, run `uv run detect-secrets scan --baseline .secrets.baseline`.
      - id: detect-secrets
        name: detect-secrets
        entry: uv run --locked detect-secrets-hook --baseline .secrets.baseline
        language: system
        # The docs lock file's package checksums look like secrets to the entropy checks.
        exclude: (^docs/pnpm-lock\.yaml$|\.template\.env$)

      - id: env-template-sync
        name: Ensure .template.env and .env match each other
        entry: uv run --locked python scripts/check_env_template.py
        language: system
        pass_filenames: false

      # Python. Ruff fixes before it formats, as Ruff recommends.
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
        files: ^(scripts|src|tests)/

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format
        language: system
        types: [python]
        files: ^(scripts|src|tests)/

      # ty and interrogate check all of scripts/, src/ and tests/ on any Python change:
      # ty needs the full import graph, and interrogate's badge must show the full
      # coverage, not that of the changed files only.
      - id: ty
        name: ty
        entry: uv run --locked ty check scripts src tests
        language: system
        types: [python]
        files: ^(scripts|src|tests)/
        pass_filenames: false

      - id: interrogate
        name: interrogate
        entry: uv run --locked interrogate scripts src tests
        language: system
        types: [python]
        files: ^(scripts|src|tests)/
        pass_filenames: false

      # GitHub Actions: zizmor audits the workflows, any action definitions, this file
      # and the Dependabot config. It runs offline unless a GitHub token is set (CI sets
      # one), and with the strictest persona, so no finding is hidden.
      - id: zizmor
        name: zizmor
        entry: uv run --locked zizmor --persona=auditor .
        language: system
        files: ^(\.github/|\.pre-commit-config\.yaml$)
        pass_filenames: false
